services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rentaltrack-test-root
      MYSQL_DATABASE: rentaltrack_test
      MYSQL_USER: rentaltrack
      MYSQL_PASSWORD: rentaltrack
    ports:
      - "127.0.0.1:33317:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./backend/src/test/resources/mysql-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prentaltrack-test-root"]
      interval: 3s
      timeout: 3s
      retries: 30
