name: billisan-orin-local

services:
  orin-postgres:
    image: mirror.gcr.io/pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORIN_POSTGRES_DB:?ORIN_POSTGRES_DB is required}
      POSTGRES_USER: ${ORIN_POSTGRES_USER:?ORIN_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${ORIN_POSTGRES_PASSWORD:?ORIN_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${ORIN_POSTGRES_PORT:-5433}:5432"
    volumes:
      - orin-postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./scripts:/opt/billisan/orin-postgres/scripts:ro
      - ./verification:/opt/billisan/orin-postgres/verification:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  orin-postgres-data:
