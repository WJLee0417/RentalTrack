stages:
  - test

phase1-backend-validation:
  stage: test
  image: eclipse-temurin:21-jdk-jammy

  services:
    - name: mysql:8.4
      alias: mysql

  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: rentaltrack_test
    MYSQL_USER: rentaltrack
    MYSQL_PASSWORD: rentaltrack
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/rentaltrack_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
    SPRING_DATASOURCE_USERNAME: rentaltrack
    SPRING_DATASOURCE_PASSWORD: rentaltrack
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/

  before_script:
    - cd backend
    - chmod +x gradlew
    - |
      bash -c '
        for i in $(seq 1 60); do
          if (echo > /dev/tcp/mysql/3306) >/dev/null 2>&1; then
            echo "MySQL is reachable"
            exit 0
          fi
          sleep 2
        done
        echo "MySQL did not become reachable"
        exit 1
      '

  script:
    - ./gradlew clean test --no-daemon --stacktrace

  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - backend/build/test-results/test/TEST-*.xml
    paths:
      - backend/build/reports/tests/test/

  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
