spring:
  application:
    name: rentaltrack

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rentaltrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:rentaltrack}
    password: ${SPRING_DATASOURCE_PASSWORD:rentaltrack}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

rentaltrack:
  auth:
    jwt:
      secret-base64: ${RENTALTRACK_JWT_SECRET_BASE64:UmVudGFsVHJhY2stRGV2LU9ubHktSldULVNlY3JldC0zMi1CeXRlcyE=}
      access-token-seconds: ${RENTALTRACK_JWT_ACCESS_TOKEN_SECONDS:1800}
  storage:
    local:
      root: ${RENTALTRACK_STORAGE_ROOT:${java.io.tmpdir}/rentaltrack-images}
    max-image-bytes: ${RENTALTRACK_MAX_IMAGE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
