services:
  mysql:
    image: mysql:8.4
    container_name: rentaltrack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rentaltrack-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rentaltrack}
      MYSQL_USER: ${MYSQL_USER:-rentaltrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rentaltrack}
    ports:
      - "3306:3306"
    volumes:
      - rentaltrack_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rentaltrack-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: rentaltrack-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rentaltrack}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-rentaltrack}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-rentaltrack}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rentaltrack_mysql_data:
