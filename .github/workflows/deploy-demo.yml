name: Deploy RentalTrack demo to GitHub Pages

on:
  push:
    branches: [refactor/rentaltrack-web-skeleton]
    paths: ["frontend/web/**", ".github/workflows/deploy-demo.yml"]
  pull_request:
    branches: [refactor/rentaltrack-web-skeleton]
    paths: ["frontend/web/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rentaltrack-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build read-only demo
        run: npm run build:demo
        env:
          VITE_BASE_PATH: /RentalTrack/
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify demo without API server
        run: npm run check:demo
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-traces
          path: frontend/web/test-results/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/refactor/rentaltrack-web-skeleton'
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/refactor/rentaltrack-web-skeleton'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
