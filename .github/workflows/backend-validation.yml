name: Backend Validation

on:
  push:
    branches:
      - refactor/rentaltrack-web-skeleton
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rentaltrack_test
          MYSQL_USER: rentaltrack
          MYSQL_PASSWORD: rentaltrack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/rentaltrack_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: rentaltrack
      SPRING_DATASOURCE_PASSWORD: rentaltrack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run backend validation
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/
          if-no-files-found: ignore
