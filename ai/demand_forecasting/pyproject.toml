[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rentaltrack-demand-forecasting"
version = "0.1.0"
description = "RentalTrack demand forecasting pipeline with Historical Average and Granite TTM-R3"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.3.3,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
ttm = [
  "granite-tsfm==0.3.9",
]
experiment = [
  "granite-tsfm==0.3.9",
  "mysql-connector-python>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
